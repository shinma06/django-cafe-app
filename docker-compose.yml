services:
  postgres:
    image: postgres:16-alpine
    container_name: cafeapp-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cafeapp}
      POSTGRES_USER: ${POSTGRES_USER:-shinma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 5

  web:
    build: .
    container_name: cafeapp-web
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-shinma}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cafeapp}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-dev-key-change-in-production}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
